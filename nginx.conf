server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # не показываем версию nginx
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Заголовки безопасности. CSP разрешает скрипты и стили только с этого адреса,
    # запросы — только к API; data:/blob: нужны для превью фото и видео перед загрузкой.
    # Если адрес API изменится, поправьте connect-src, img-src и media-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.mptazalyk.kg; media-src 'self' data: blob: https://api.mptazalyk.kg; connect-src 'self' https://api.mptazalyk.kg; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # админку не нужно индексировать поисковикам
    add_header X-Robots-Tag "noindex, nofollow" always;

    # файлы сборки с хешем в имени можно кэшировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header внутри location отменяет заголовки сервера — повторяем их
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.mptazalyk.kg; media-src 'self' data: blob: https://api.mptazalyk.kg; connect-src 'self' https://api.mptazalyk.kg; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html не кэшируем, чтобы после обновления сразу подтягивалась новая версия
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.mptazalyk.kg; media-src 'self' data: blob: https://api.mptazalyk.kg; connect-src 'self' https://api.mptazalyk.kg; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    # Прокси /api/ на host.docker.internal убран: админка обращается к API по полному адресу
    # (VITE_API_URL), а на Linux-сервере этого имени нет, и nginx мог не запуститься.
}
